<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" width="100%" height="100%">
  <defs>
    <!-- Vibrant Rose-to-Orange Neon Gradient -->
    <linearGradient id="sayNowGradient" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="45%" stop-color="#ff174d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Glow & Spark Gradient -->
    <linearGradient id="sayNowSparkGrad" x1="12" y1="10" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe4ea" />
      <stop offset="100%" stop-color="#ff174d" />
    </linearGradient>

    <!-- Deep Translucent Glow Bubble Fill -->
    <linearGradient id="sayNowBubbleFill" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a0d16" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#120408" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="sayNowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="#ff174d" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Speech Bubble Base with Tail -->
  <path
    d="M 20 5 C 11.16 5 4 11.72 4 20 C 4 23.45 5.25 26.63 7.38 29.17 L 5.5 35.5 L 12.32 33.72 C 14.65 34.8 17.24 35 20 35 C 28.84 35 36 28.28 36 20 C 36 11.72 28.84 5 20 5 Z"
    fill="url(#sayNowBubbleFill)"
    stroke="url(#sayNowGradient)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Internal Dynamic Voice Pulse & Instant Spark -->
  <g filter="url(#sayNowGlow)">
    <!-- Left Voice Wave -->
    <path
      d="M 13 18 L 13 22"
      stroke="url(#sayNowGradient)"
      stroke-width="2.4"
      stroke-linecap="round"
    />

    <!-- Dynamic Center Bolt ("N / Instant Spark") -->
    <path
      d="M 18 13 L 23 20 L 19 21 L 24 28"
      stroke="url(#sayNowSparkGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right Voice Wave -->
    <path
      d="M 28 17 L 28 23"
      stroke="url(#sayNowGradient)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
  </g>

  <!-- Ambient Live Broadcast Dot -->
  <circle cx="29" cy="11" r="2.2" fill="#ff174d" filter="url(#sayNowGlow)" />
  <circle cx="29" cy="11" r="1.1" fill="#ffffff" />
</svg>
