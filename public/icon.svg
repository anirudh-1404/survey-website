<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <radialGradient id="favBgGrad" cx="18" cy="18" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191c2b" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>
    <linearGradient id="favNeonGrad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="50%" stop-color="#ff174d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="favBeamGrad" x1="18" y1="18" x2="30" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ff6584" />
      <stop offset="100%" stop-color="#ff174d" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff174d" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="36" height="36" rx="8" fill="url(#favBgGrad)" stroke="#27272a" stroke-width="0.8" />

  <!-- Concentric Radar Circles with Active Scanning Notch -->
  <g filter="url(#favGlow)">
    <path
      d="M 27 9 A 14.5 14.5 0 1 0 29.5 13.5"
      stroke="url(#favNeonGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <circle cx="18" cy="18" r="10" stroke="url(#favNeonGrad)" stroke-width="2.2" stroke-opacity="0.95" />
    <circle cx="18" cy="18" r="5.5" stroke="url(#favNeonGrad)" stroke-width="2.0" stroke-opacity="0.9" />

    <!-- Data Coordinate Dots -->
    <circle cx="18" cy="8" r="1.3" fill="#ff7597" />
    <circle cx="18" cy="28" r="1.3" fill="#ff7597" />
    <circle cx="8" cy="18" r="1.3" fill="#ff7597" />
    <circle cx="28" cy="18" r="1.3" fill="#ff7597" />

    <!-- Radar Sweep Beam -->
    <line x1="18" y1="18" x2="28.5" y2="7.5" stroke="url(#favBeamGrad)" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- Glowing Center Emitter -->
  <circle cx="18" cy="18" r="3.2" fill="#ff174d" filter="url(#favGlow)" />
  <circle cx="18" cy="18" r="1.5" fill="#ffffff" />
</svg>
