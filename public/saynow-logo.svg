<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 40" fill="none" width="100%" height="100%">
  <defs>
    <!-- Vibrant Rose Neon Gradient -->
    <linearGradient id="sayNowGradient" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="45%" stop-color="#ff174d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Glowing Bolt Gradient -->
    <linearGradient id="sayNowSparkGrad" x1="12" y1="10" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe4ea" />
      <stop offset="100%" stop-color="#ff174d" />
    </linearGradient>

    <!-- Translucent Dark Bubble Fill -->
    <linearGradient id="sayNowBubbleFill" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a0d16" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#120408" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sayNowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="#ff174d" flood-opacity="0.8" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff174d" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- SayNow Emblem -->
  <g transform="translate(0, 0)">
    <path
      d="M 20 5 C 11.16 5 4 11.72 4 20 C 4 23.45 5.25 26.63 7.38 29.17 L 5.5 35.5 L 12.32 33.72 C 14.65 34.8 17.24 35 20 35 C 28.84 35 36 28.28 36 20 C 36 11.72 28.84 5 20 5 Z"
      fill="url(#sayNowBubbleFill)"
      stroke="url(#sayNowGradient)"
      stroke-width="2.4"
      stroke-linejoin="round"
    />
    <g filter="url(#sayNowGlow)">
      <path d="M 13 18 L 13 22" stroke="url(#sayNowGradient)" stroke-width="2.4" stroke-linecap="round" />
      <path d="M 18 13 L 23 20 L 19 21 L 24 28" stroke="url(#sayNowSparkGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 28 17 L 28 23" stroke="url(#sayNowGradient)" stroke-width="2.4" stroke-linecap="round" />
    </g>
    <circle cx="29" cy="11" r="2.2" fill="#ff174d" filter="url(#sayNowGlow)" />
    <circle cx="29" cy="11" r="1.1" fill="#ffffff" />
  </g>

  <!-- Typography: "SayNow." -->
  <g transform="translate(50, 28)">
    <!-- "Say" in Crisp White -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5px">Say</text>
    <!-- "Now" in Italic Neon Gradient -->
    <text x="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" font-style="italic" fill="url(#sayNowGradient)" letter-spacing="-0.5px">Now</text>
    <!-- Glowing Accent Dot -->
    <circle cx="102" cy="-4" r="3" fill="#ff174d" filter="url(#dotGlow)" />
  </g>
</svg>
