<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="favBarGrad" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="favCheckGrad" x1="12" y1="8" x2="26" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#f43f5e" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)" stroke="#27272a" stroke-width="0.8" />

  <!-- Survey poll bars forming 'P' -->
  <rect x="4.5" y="15" width="2.3" height="12" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="8.3" y="10" width="2.3" height="17" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="12.1" y="5.5" width="2.3" height="21.5" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="15.9" y="5.5" width="2.3" height="5" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="19.7" y="6.5" width="2.3" height="5" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="23" y="9.5" width="2.3" height="8.5" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="19.7" y="16.5" width="2.3" height="5" rx="1.15" fill="url(#favBarGrad)" />
  <rect x="15.9" y="17.5" width="2.3" height="5" rx="1.15" fill="url(#favBarGrad)" />

  <!-- Glowing Vote Checkmark -->
  <path
    d="M13.5 15.5L16.8 18.8L24.8 9"
    stroke="url(#favCheckGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />
</svg>
