<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="sayNowFavBg" cx="20" cy="20" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0b12" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>
    <linearGradient id="sayNowFavGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="50%" stop-color="#ff174d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="sayNowFavBolt" x1="15" y1="12" x2="25" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe4ea" />
      <stop offset="100%" stop-color="#ff174d" />
    </linearGradient>
    <filter id="sayNowFavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff174d" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="40" height="40" rx="9" fill="url(#sayNowFavBg)" stroke="#27272a" stroke-width="0.8" />

  <!-- Speech Bubble with Dynamic Voice Spark -->
  <path
    d="M 20 6 C 11.72 6 5 12.27 5 20 C 5 23.22 6.17 26.19 8.15 28.56 L 6.5 34.5 L 12.87 32.84 C 15.04 33.85 17.46 34 20 34 C 28.28 34 35 27.73 35 20 C 35 12.27 28.28 6 20 6 Z"
    fill="#16080e"
    stroke="url(#sayNowFavGrad)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Internal Soundwaves / Spark Bolt -->
  <g filter="url(#sayNowFavGlow)">
    <path d="M 13 18 L 13 22" stroke="url(#sayNowFavGrad)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 18 13 L 23 20 L 19 21 L 24 28" stroke="url(#sayNowFavBolt)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 27 17 L 27 23" stroke="url(#sayNowFavGrad)" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Broadcast Indicator Dot -->
  <circle cx="28" cy="11" r="2.0" fill="#ff174d" />
  <circle cx="28" cy="11" r="1.0" fill="#ffffff" />
</svg>
